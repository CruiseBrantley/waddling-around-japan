# SSL configuration for sirian.ddns.net
$SERVER["socket"] == ":443" {
  ssl.engine = "enable"
  ssl.pemfile = "/etc/letsencrypt/live/sirian.ddns.net/fullchain.pem"
  ssl.privkey = "/etc/letsencrypt/live/sirian.ddns.net/privkey.pem"
}

# Reverse proxy for sirian.ddns.net - proxy to Node.js server on port 4000
# Exclude Certbot acme-challenge paths so we can verify our Let's Encrypt certs!
$HTTP["url"] !~ "^/\.well-known/acme-challenge/" {
  $HTTP["host"] == "sirian.ddns.net" {
    proxy.server = (
      "" => (
        (
          "host" => "127.0.0.1",
          "port" => 4000
        )
      )
    )
  }
}