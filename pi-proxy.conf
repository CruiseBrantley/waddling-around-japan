# Reverse proxy for sirian.ddns.net - proxy to Node.js server on port 4000
server.modules += ( "mod_proxy" )
server.modules += ( "mod_openssl" )

$HTTP["host"] == "sirian.ddns.net" {
  ssl.engine = "enable"
  ssl.pemfile = "/etc/ssl/private/sirian.pem"

  proxy.server = (
    "" => (
      (
        "host" => "127.0.0.1",
        "port" => 4000
      )
    )
  )

  proxy.forwarded = ( "x-forwarded-for", "x-forwarded-host", "x-forwarded-proto", "host", "port", "scheme" )
}